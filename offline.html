<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线模式 - GreenAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .offline-container {
      text-align: center;
      max-width: 480px;
      padding: 48px 32px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
    }
    
    .offline-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 1.75rem;
      color: #166534;
      margin-bottom: 16px;
    }
    
    .subtitle {
      color: #6b7280;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    .tips {
      background: #f0fdf4;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 32px;
      text-align: left;
    }
    
    .tips-title {
      font-weight: 600;
      color: #166534;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tips-list {
      list-style: none;
      color: #4b5563;
      font-size: 0.875rem;
    }
    
    .tips-list li {
      padding: 6px 0;
      padding-left: 20px;
      position: relative;
    }
    
    .tips-list li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #10b981;
    }
    
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #10b981;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .retry-btn:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .cached-hint {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">🌍</div>
    <h1>暂时离线中</h1>
    <p class="subtitle">
      哎呀，网络连接好像断开了。<br>
      不过别担心，GreenAI 会帮你记住学习进度！
    </p>
    
    <div class="tips">
      <div class="tips-title">
        <span>💡</span>
        <span>离线小贴士</span>
      </div>
      <ul class="tips-list">
        <li>已缓存的课程内容仍可正常访问</li>
        <li>学习进度会在联网后自动同步</li>
        <li>检查一下 Wi-Fi 或移动网络设置</li>
        <li>靠近路由器可能会有更好的信号</li>
      </ul>
    </div>
    
    <button class="retry-btn" onclick="window.location.reload()">
      <span>🔄</span>
      <span>重新连接</span>
    </button>
    
    <p class="cached-hint">
      部分内容已缓存到本地，可尝试访问首页
    </p>
  </div>
  
  <script>
    // 监听网络状态变化，自动刷新
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
